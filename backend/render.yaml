# Render Blueprint — deploy with "New + > Blueprint" in the Render
# dashboard, pointing at this repo. See DEPLOY.md for the full walkthrough.
services:
  - type: web
    name: brotherly-api
    runtime: python
    plan: starter               # free tier's 512MB RAM is too tight for torch + chromadb
    region: oregon               # change to whichever region is closest to you
    rootDir: backend
    buildCommand: >
      pip install --index-url https://download.pytorch.org/whl/cpu torch &&
      pip install -r requirements.txt
    startCommand: uvicorn main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /api/health
    envVars:
      - key: NVIDIA_API_KEY
        sync: false             # set manually in the Render dashboard
      - key: JWT_SECRET
        generateValue: true     # Render will generate a random secret for you
      - key: CORS_ORIGINS
        value: https://your-frontend.vercel.app   # update after the Vercel deploy
      - key: PYTHON_VERSION
        value: 3.12.3
    disk:
      name: brotherly-data
      mountPath: /opt/render/project/src/backend/database
      sizeGB: 1
